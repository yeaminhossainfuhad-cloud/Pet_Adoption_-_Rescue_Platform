{% extends "base.html" %}
{% block title %}Favorites{% endblock %}
{% block content %}
<h1 class="h2 mb-3">Favorite pets</h1>
<div class="row g-4">
  {% for pet in pets %}
  <div class="col-12 col-sm-6 col-lg-4">{% include "includes/pet_card.html" %}</div>
  {% empty %}
  <div class="empty-state">
    <div class="big">♡</div>
    <p class="mb-1">You haven't saved any pets yet.</p>
    <a href="{% url 'pet_list' %}">Browse pets and tap Save</a>
  </div>
  {% endfor %}
</div>
{% endblock %}
